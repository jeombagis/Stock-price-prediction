<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Apple Pro Deep Navy / Royal Blue -->
    <linearGradient id="stockalgo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077ED" />
      <stop offset="50%" stop-color="#0056C7" />
      <stop offset="100%" stop-color="#002466" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="stockalgo-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Ambient Top-Left Specular Light -->
    <radialGradient id="stockalgo-specular" cx="22%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#0077ED" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0077ED" stop-opacity="0" />
    </radialGradient>

    <!-- Horizon Area Gradient with smooth decay -->
    <linearGradient id="stockalgo-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="70%" stop-color="#0071E3" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0" />
    </linearGradient>

    <!-- Mask to fade out area fill on the right -->
    <linearGradient id="stockalgo-mask-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <mask id="stockalgo-mask">
      <rect width="512" height="512" fill="url(#stockalgo-mask-grad)" />
    </mask>

    <!-- Candlestick Bar Gradients -->
    <linearGradient id="stockalgo-bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="stockalgo-bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.22" />
    </linearGradient>

    <linearGradient id="stockalgo-bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.28" />
    </linearGradient>

    <!-- AI Predicted Forward Candlestick -->
    <linearGradient id="stockalgo-bar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.15" />
    </linearGradient>

    <!-- Trajectory Stroke Gradient -->
    <linearGradient id="stockalgo-traj" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="30%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Node Halo Gradient -->
    <radialGradient id="stockalgo-node-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="60%" stop-color="#0071E3" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="stockalgo-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="stockalgo-spark" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Apple Squircle Base with Precision Rim -->
  <rect width="512" height="512" rx="114" fill="url(#stockalgo-bg)" />
  <rect width="512" height="512" rx="114" fill="url(#stockalgo-specular)" />
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="url(#stockalgo-rim)" stroke-width="4" />

  <!-- 2. Technical Coordinate Grid -->
  <g opacity="0.55">
    <line x1="76" y1="185" x2="436" y2="185" stroke="#FFFFFF" stroke-opacity="0.1" stroke-dasharray="6 8" stroke-width="1.5" />
    <line x1="76" y1="285" x2="436" y2="285" stroke="#FFFFFF" stroke-opacity="0.1" stroke-dasharray="6 8" stroke-width="1.5" />
    <line x1="76" y1="385" x2="436" y2="385" stroke="#FFFFFF" stroke-opacity="0.1" stroke-dasharray="6 8" stroke-width="1.5" />
  </g>

  <!-- 3. Candlesticks: 3 Historical + 1 AI Forecast Pillar -->
  <!-- Historical Bar 1 -->
  <g>
    <line x1="115" y1="275" x2="115" y2="415" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round" opacity="0.5" />
    <rect x="98" y="300" width="34" height="95" rx="8" fill="url(#stockalgo-bar1)" stroke="#BAE6FD" stroke-opacity="0.4" stroke-width="1.5" />
  </g>

  <!-- Historical Bar 2 -->
  <g>
    <line x1="183" y1="220" x2="183" y2="415" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round" opacity="0.65" />
    <rect x="166" y="245" width="34" height="150" rx="8" fill="url(#stockalgo-bar2)" stroke="#BAE6FD" stroke-opacity="0.5" stroke-width="1.5" />
  </g>

  <!-- Historical Bar 3 -->
  <g>
    <line x1="251" y1="160" x2="251" y2="415" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    <rect x="234" y="185" width="34" height="210" rx="8" fill="url(#stockalgo-bar3)" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" />
  </g>

  <!-- AI Predicted Pillar 4 -->
  <g>
    <line x1="319" y1="115" x2="319" y2="415" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
    <rect x="302" y="135" width="34" height="260" rx="8" fill="url(#stockalgo-bar4)" stroke="#67E8F9" stroke-width="2" stroke-opacity="0.9" />
  </g>

  <!-- 4. Area Gradient Under Prediction Curve -->
  <path d="M 80 360 C 145 355, 190 290, 251 225 C 310 160, 360 125, 420 102 L 440 420 L 80 420 Z" fill="url(#stockalgo-area)" mask="url(#stockalgo-mask)" />

  <!-- 5. Trajectory Glow Underlayer -->
  <path d="M 80 360 C 145 355, 190 290, 251 225 C 310 160, 360 125, 420 102" fill="none" stroke="#00E5FF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" filter="url(#stockalgo-glow)" />

  <!-- 6. Trajectory Main Vector -->
  <path d="M 80 360 C 145 355, 190 290, 251 225 C 310 160, 360 125, 420 102" fill="none" stroke="url(#stockalgo-traj)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 7. Discrete Algorithmic Data Nodes -->
  <circle cx="115" cy="346" r="6" fill="#FFFFFF" opacity="0.95" />
  <circle cx="183" cy="295" r="6" fill="#FFFFFF" opacity="0.98" />
  <circle cx="251" cy="225" r="7.5" fill="#FFFFFF" />
  <circle cx="319" cy="163" r="7.5" fill="#FFFFFF" />

  <!-- 8. AI Target Apex Beacon & Starburst -->
  <!-- Target Reticle Orbit Ring -->
  <circle cx="420" cy="102" r="28" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.9" />
  <!-- Target Radial Glow Halo -->
  <circle cx="420" cy="102" r="20" fill="url(#stockalgo-node-halo)" opacity="0.85" />
  <!-- Core Target Center -->
  <circle cx="420" cy="102" r="9.5" fill="#FFFFFF" />

  <!-- AI Prediction Diamond Starburst -->
  <path d="M 420 72 L 424.5 97.5 L 450 102 L 424.5 106.5 L 420 132 L 415.5 106.5 L 390 102 L 415.5 97.5 Z" fill="#FFFFFF" filter="url(#stockalgo-spark)" opacity="0.95" />
</svg>